server:
  port: 8080

spring:
  application:
    name: mini-api-gateway

  datasource:
    url: ${MAG_DB_URL:jdbc:postgresql://localhost:5432/mag}
    username: ${MAG_DB_USER:mag}
    password: ${MAG_DB_PASS:mag}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ---- MAG-specific settings ----
mag:
  jwt:
    # TODO M2: set via environment variable or Vault — never commit the real secret
    secret: ${MAG_JWT_SECRET:change-me-before-production}
  admin:
    # TODO M2: protect admin endpoints with this credential
    credential: ${MAG_ADMIN_CREDENTIAL:change-me-before-production}
  upstream:
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
  circuit-breaker:
    failure-threshold: 5
    open-duration-seconds: 30
    half-open-probes: 3
